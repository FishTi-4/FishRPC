syntax = "proto3";

package package_name;

message Req{
  int32 id = 1;
  string method = 2;
  bytes params = 3;
}

message Resp{
  int32 id = 1;
  int32 error = 2;
  bytes error_message = 3;
  bytes result = 4;
}

message RpcPackage{

  oneof package_type {
    Req request = 1;
    Resp response = 2;
  }

}